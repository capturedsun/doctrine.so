<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doctrine — wordmark options</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=UnifrakturCook:wght@700&family=Pirata+One&family=Grenze+Gotisch:wght@700&family=New+Rocker&family=Jacquard+24&family=Rubik+Mono+One&family=Russo+One&family=Stalinist+One&family=Bungee&family=Alfa+Slab+One&family=Ultra&family=Black+Ops+One&family=Stardos+Stencil:wght@700&family=Kumar+One&family=Bigshot+One&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet">
<style>
@font-face { font-family: Laandbrau; src: url(/_/fonts/Laandbrau.ttf); }
/* Germanika slot: drop the file at /_/fonts/Germanika.ttf. */
@font-face { font-family: Germanika; src: url(/_/fonts/Germanika.ttf); }
:root { --black:#080C0B; --red:#B82A26; --cream:#E6D0A9; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--black); color: var(--cream); font: 15px/1.4 'IBM Plex Mono', monospace; width: 1920px; }
header { padding: 48px 72px 24px; border-bottom: 4px solid var(--red); }
header h1 { font: 600 20px 'IBM Plex Mono', monospace; letter-spacing: .2em; text-transform: uppercase; }
header p { color: #8d826d; margin-top: 8px; }
.row { display: grid; grid-template-columns: 80px 760px 1fr 360px; align-items: center; gap: 32px; padding: 26px 72px; border-bottom: 1px solid #2a2d2b; }
.n { font: 600 28px 'IBM Plex Mono', monospace; color: var(--red); }
.big { font-size: 92px; line-height: 1.1; white-space: nowrap; }
.meta b { display: block; font-size: 18px; letter-spacing: .08em; }
.meta span { color: #8d826d; }
.small { background: var(--cream); color: var(--red); font-size: 34px; padding: 14px 22px; white-space: nowrap; }
</style>
</head>
<body>
<header><h1>Doctrine · wordmark options for mockup A</h1><p>Mixed case. Hero size 92px, cream on black; small size 34px, red on cream.</p></header>
<main id="rows"></main>
<script>
const faces = [
  ["Laandbrau", "Laandbrau", "Blackletter. © 2016 Paulo W., all rights reserved. No licence in the file; web use unconfirmed."],
  ["Germanika", "Germanika, UnifrakturMaguntia", "Blackletter. Slot ready at /_/fonts/Germanika.ttf. Not on the machine: shown in the STAND-IN UnifrakturMaguntia (OFL 1.1)."],
  ["UnifrakturCook", "UnifrakturCook", "Blackletter, bold. OFL 1.1."],
  ["Pirata One", "Pirata One", "Blackletter, simplified. OFL 1.1."],
  ["Grenze Gotisch", "Grenze Gotisch", "Blackletter, bold weight. OFL 1.1."],
  ["New Rocker", "New Rocker", "Blackletter display. OFL 1.1."],
  ["Jacquard 24", "Jacquard 24", "Woven pixel blackletter. OFL 1.1. (my pick)"],
  ["Rubik Mono One", "Rubik Mono One", "Constructivist block. OFL 1.1."],
  ["Russo One", "Russo One", "Soviet display. OFL 1.1."],
  ["Stalinist One", "Stalinist One", "Soviet display. OFL 1.1."],
  ["Bungee", "Bungee", "Signage block. OFL 1.1."],
  ["Alfa Slab One", "Alfa Slab One", "Poster slab. OFL 1.1."],
  ["Ultra", "Ultra", "Poster slab. Apache 2.0."],
  ["Black Ops One", "Black Ops One", "Stencil. OFL 1.1."],
  ["Stardos Stencil", "Stardos Stencil", "Stencil, bold. OFL 1.1."],
  ["Kumar One", "Kumar One", "Woodtype poster grotesque. OFL 1.1. (my pick)"],
  ["Bigshot One", "Bigshot One", "Fat-face poster. OFL 1.1. (my pick)"],
];
document.getElementById("rows").innerHTML = faces.map(([name, stack, note], i) => `
  <div class="row">
    <span class="n">${String(i + 1).padStart(2, "0")}</span>
    <span class="big" style="font-family:${stack.split(", ").map(f => `'${f}'`).join(", ")}">Doctrine</span>
    <span class="meta"><b>${name}</b><span>${note}</span></span>
    <span class="small" style="font-family:${stack.split(", ").map(f => `'${f}'`).join(", ")}">Doctrine</span>
  </div>`).join("");
</script>
</body>
</html>
